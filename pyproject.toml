# Workspace root (virtual): holds shared tooling config only.
# The installable package lives in packages/obsei.

[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
obsei = { workspace = true }

[dependency-groups]
dev = [
    "obsei",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/obsei/src", "packages/obsei/tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/obsei/src", "packages/obsei/tests"]
mypy_path = "packages/obsei/src"

[tool.pytest.ini_options]
testpaths = ["packages/obsei/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["obsei"]
branch = true
