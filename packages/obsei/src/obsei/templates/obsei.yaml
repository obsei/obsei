# obsei configuration. Docs: https://docs.obsei.com/configuration/
# Secrets never go in this file: set the environment variables named by *_env fields.
#   OBSEI_DB_KEY          encrypts the local database (16+ characters)
#   OBSEI_PSEUDONYM_SALT  pseudonymises author handles (16+ characters); unset = authors dropped
# 'obsei init' generates both in .obsei/secrets.env; variables set in the environment win.
version: 1

store:
  path: obsei.duckdb

privacy:
  redact: true
  # PII detectors to apply: global, north_america, uk, eu, latam, apac, india, africa
  regions: [global, north_america, uk, eu, latam, apac, india, africa]

# Models. The default classifier runs in process, so nothing leaves the machine:
#   pip install 'obsei[local]' && obsei models download
llms:
  default:
    api: local
    model: MoritzLaurer/bge-m3-zeroshot-v2.0
    # models: {sentiment: fastino/gliner2-multi-v1}   # optional per-question model
  # A decision model served by llama.cpp (e.g. Julia-1):
  # default:
  #   api: decision
  #   url_env: OBSEI_DECISION_URL
  # A chat model (needed for ask, theme labels and free-text fields), e.g. Ollama:
  # chat:
  #   base_url: http://localhost:11434/v1
  #   model: qwen3:8b
  # A cloud chat model needs its own llms entry and must pass the egress policy (private mode with
  # its host allow-listed); use one only with consent to send feedback to that provider.
  # See https://docs.obsei.com/guides/models/
# ask_llm: chat

pipelines:
  - name: feedback
    sources:
      - key: sample
        type: csv
        config:
          path: feedback.csv
          fields: {text: comment, id: id, created_at: date, rating: rating, lang: lang}
      # - key: ios
      #   type: appstore
      #   config: {app_id: "284882215", countries: [us, gb, de, br, jp, in]}
      # - key: android
      #   type: playstore
      #   config: {package_name: com.example.app, credentials_file: play-sa.json}
      # - key: issues
      #   type: github_issues
      #   config: {repo: owner/repo}
    # Classify sentiment and intent with the local classifier ('obsei init' enables it when
    # obsei[local] is installed).
    # enrichers:
    #   - type: classify
    #     config: {llm: default, threshold: 0.4}   # 0.4 suits the local default; tune per question
    sinks:
      - type: parquet
        config: {directory: exports}
