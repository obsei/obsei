[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "obsei"
dynamic = ["version"]
description = "Privacy-first, self-hosted, AI-native Voice of Customer. Bring your own sources, models and agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lalit Pagaria" }]
maintainers = [{ name = "Lalit Pagaria" }]
keywords = [
    "voice-of-customer",
    "customer-feedback",
    "feedback-analytics",
    "privacy",
    "self-hosted",
    "mcp",
    "ai-agents",
    "llm",
    "gdpr",
    "dpdp",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://obsei.com"
Repository = "https://github.com/obsei/obsei"
Issues = "https://github.com/obsei/obsei/issues"
Changelog = "https://github.com/obsei/obsei/blob/master/packages/obsei/CHANGELOG.md"

[project.scripts]
obsei = "obsei.cli:app"

[tool.hatch.version]
path = "src/obsei/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/obsei"]
