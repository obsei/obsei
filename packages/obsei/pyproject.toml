[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obsei"
dynamic = ["version"]
description = "Privacy-first, self-hosted, AI-native Voice of Customer. Bring your own sources, models and agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lalit Pagaria" }]
maintainers = [{ name = "Lalit Pagaria" }]
keywords = [
    "voice-of-customer",
    "customer-feedback",
    "feedback-analytics",
    "privacy",
    "pii-redaction",
    "sentiment-analysis",
    "multilingual",
    "self-hosted",
    "mcp",
    "ai-agents",
    "llm",
    "gdpr",
    "dpdp",
    "duckdb",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "defusedxml>=0.7.1,<1",
    "duckdb>=1.5.6,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
google = ["google-auth[requests]>=2.58.1,<3"]
mcp = [
    "mcp>=2.3,<3",
    # obsei serve imports these directly; mcp also depends on them.
    "anyio>=4.9,<5",
    "starlette>=0.48,<2",
    "uvicorn>=0.31.1,<1",
]
apple = ["pyjwt[crypto]>=2.15.1,<3"]
sql = ["sqlalchemy>=2.0.36,<3"]
names = ["gliner>=0.2.21,<1"]
embeddings = ["fastembed>=0.8,<1"]

[project.urls]
Homepage = "https://obsei.com"
Documentation = "https://docs.obsei.com"
Blog = "https://blog.obsei.com"
Repository = "https://github.com/obsei/obsei"
Issues = "https://github.com/obsei/obsei/issues"
Changelog = "https://github.com/obsei/obsei/blob/master/packages/obsei/CHANGELOG.md"

[project.scripts]
obsei = "obsei.cli:app"

[tool.hatch.version]
path = "src/obsei/_version.py"
source = "code"
expression = "__version__"

[tool.hatch.build.targets.wheel]
packages = ["src/obsei"]
