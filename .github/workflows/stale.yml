name: Stale

on:
  schedule:
    - cron: "41 2 * * *"

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security,help wanted,good first issue"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: >
            This issue has had no activity for 60 days and will close in 14 days
            unless there is new activity. Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will close in 14 days
            unless there is new activity.
