# obsei serve with an encrypted store in a named volume. Docs: https://docs.obsei.com/quickstart/#docker-compose
services:
  obsei:
    image: ghcr.io/obsei/obsei:1.0.1 # x-release-please-version
    command: ["serve", "--host", "0.0.0.0", "--port", "8765"]
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - obsei-data:/data
      - ./obsei.yaml:/data/obsei.yaml:ro
    healthcheck:
      test: ["CMD", "python", "/opt/obsei/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  obsei-data:
